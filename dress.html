<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Enny China 产品目录｜女装、包包、鞋子与饰品。"><title>产品目录｜Enny China</title>
  <style>
    :root{--ink:#201d1b;--muted:#756e68;--cream:#f7f3ee;--line:#e7ded5;--accent:#a26d5f}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:0 28px}header{border-bottom:1px solid var(--line);background:rgba(247,243,238,.95);position:sticky;top:0;z-index:4;backdrop-filter:blur(14px)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between}.brand{font:25px "Arial Rounded MT Bold","Avenir Next Rounded","Trebuchet MS",sans-serif}.brand small{display:block;font:10px sans-serif;letter-spacing:.28em;color:var(--muted);text-transform:uppercase}.navlinks{display:flex;gap:30px;color:#5f5852;align-items:center}.navlinks .active{color:var(--accent);font-weight:600}.lang{border:1px solid var(--line);background:transparent;padding:6px 8px;color:var(--muted);font:12px sans-serif}.menu{display:none;background:none;border:0;font-size:22px}.intro{padding:72px 0 42px}.eyebrow{color:var(--accent);letter-spacing:.22em;text-transform:uppercase;font-size:11px;font-weight:700}.intro h1{font:clamp(42px,6vw,72px)/1 Georgia,serif;font-weight:400;margin:14px 0}.intro p{color:var(--muted);max-width:500px}.register-btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:11px 18px;cursor:pointer;font:inherit;margin-top:18px}.toolbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:26px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters button,.sort{border:1px solid var(--line);background:transparent;padding:8px 14px;color:var(--muted);cursor:pointer;font:inherit}.filters button.active,.filters button:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.sort{background:transparent}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-bottom:80px}.card{background:#fff;min-width:0}.product-image{height:325px;background:#e8d9cf;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8b6d60}.product-image img{width:100%;height:100%;object-fit:cover}.product-image span{font:italic 22px Georgia,serif}.tag{position:absolute;left:12px;top:12px;background:#fff;padding:3px 9px;font-size:11px;color:var(--accent)}.info{padding:14px 15px 18px}.info h3{margin:0;font-weight:500}.info p{margin:3px 0 0;color:var(--muted);font-size:13px}.info .ask{display:inline-block;margin-top:12px;color:var(--accent);font-size:13px}.price-lock{display:inline-block;margin-top:6px;color:var(--accent);font-size:13px;cursor:pointer}.empty{padding:45px 0;color:var(--muted);grid-column:1/-1}footer{border-top:1px solid var(--line);padding:25px 0;color:var(--muted);font-size:12px}.modal{display:none;position:fixed;inset:0;background:#201d1b99;z-index:20;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.modal-box{background:var(--cream);padding:30px;max-width:420px;width:100%;position:relative}.modal-box h2{font:30px Georgia,serif;font-weight:400;margin:0 0 8px}.modal-box p{color:var(--muted);font-size:13px}.modal-box input{display:block;width:100%;padding:12px;border:1px solid var(--line);background:white;margin:10px 0;font:inherit}.modal-box button{width:100%;padding:12px;border:0;background:var(--ink);color:white;font:inherit;cursor:pointer}.close{position:absolute;right:16px;top:10px;background:none!important;color:var(--ink)!important;width:auto!important;font-size:22px}@media(max-width:800px){.navlinks{display:none}.navlinks.show{display:flex;position:absolute;top:74px;left:0;right:0;padding:18px 20px;background:var(--cream);border-bottom:1px solid var(--line);flex-direction:column;gap:10px}.menu{display:block}.wrap{padding:0 20px}.grid{grid-template-columns:repeat(2,1fr)}.product-image{height:250px}.toolbar{display:block}.sort{margin-top:14px}}
    @media(max-width:800px){.navlinks.show{display:flex;position:absolute;top:74px;left:0;right:0;padding:18px 20px;background:var(--cream);border-bottom:1px solid var(--line);flex-direction:column;gap:10px}}
  </style>
</head>
<body>
  <header><div class="wrap nav"><a class="brand" href="index.html">Enny China<small>Fashion from China</small></a><button class="menu" onclick="document.querySelector('.navlinks').classList.toggle('show')">☰</button><nav class="navlinks"><a data-i18n="home" href="index.html">首页</a><a class="active" data-i18n="catalog" href="dress.html">产品目录</a><a data-i18n="about" href="index.html#about">关于 Enny</a><a data-i18n="contact" href="index.html#contact">联系我们</a><select class="lang" id="lang" aria-label="Language"><option value="zh">中文</option><option value="en">EN</option><option value="ar">العربية</option><option value="ru">РУС</option></select></nav></div></header>
  <main class="wrap"><section class="intro"><div class="eyebrow">The collection</div><h1>Products made<br>for everyday life.</h1><p>浏览我们的女装、包包、鞋子和饰品精选。注册后查看参考价格；如需下单，请联系 Enny。</p><button class="register-btn" id="registerBtn">注册后查看价格</button></section><div class="toolbar"><div class="filters"><button class="active" data-filter="all">全部</button><button data-filter="dress">女装</button><button data-filter="bag">包包</button><button data-filter="shoes">鞋子</button><button data-filter="accessories">饰品</button></div><select class="sort" id="sort"><option value="new">按上新排序</option><option value="az">按名称排序</option></select></div><div class="grid" id="catalog"></div></main>
  <div class="modal" id="registerModal"><div class="modal-box"><button class="close" id="closeModal">×</button><h2>查看 Enny China 价格</h2><p>留下姓名和 WhatsApp / 邮箱，提交后即可查看参考价格。正式下单请直接联系我们。</p><form id="registerForm"><input name="name" placeholder="姓名 / 公司名称" required><input name="contact" placeholder="WhatsApp 或邮箱" required><button type="submit">提交并查看价格</button></form></div></div>
  <footer><div class="wrap">© <span id="year"></span> Enny China · <a href="mailto:598297898@qq.com">598297898@qq.com</a></div></footer>
  <script>
    /* 上新只需复制一行产品资料，改 name/type/category/image 即可。图片放在 images 文件夹。 */
    const products=[
      {name:'Soft Linen Dress',type:'女装 · 连衣裙',category:'dress',price:'¥169',size:'S-XL',material:'棉麻',moq:'2件',image:'images/dress-01.jpg',new:true},
      {name:'Relaxed Knit Top',type:'女装 · 上衣',category:'dress',price:'¥129',size:'S-XL',material:'针织',moq:'2件',image:'images/dress-02.jpg',new:true},
      {name:'Everyday Shoulder Bag',type:'包包 · 单肩包',category:'bag',price:'¥149',size:'24×16×8cm',material:'PU皮',moq:'2件',image:'images/bag-01.jpg',new:true},
      {name:'Structured Mini Bag',type:'包包 · 小方包',category:'bag',price:'¥129',size:'20×14×7cm',material:'PU皮',moq:'2件',image:'images/bag-02.jpg',new:false},
      {name:'City Walk Loafers',type:'鞋子 · 乐福鞋',category:'shoes',price:'¥189',size:'35-40',material:'超纤皮',moq:'2双',image:'images/shoes-01.jpg',new:true},
      {name:'Classic Low Sneakers',type:'鞋子 · 休闲鞋',category:'shoes',price:'¥159',size:'35-40',material:'帆布/橡胶',moq:'2双',image:'images/shoes-02.jpg',new:false},
      {name:'Minimal Pearl Set',type:'饰品 · 珍珠套装',category:'accessories',price:'¥69',size:'均码',material:'合金/仿珍珠',moq:'5套',image:'images/accessories-01.jpg',new:true},
      {name:'Everyday Gold Hoops',type:'饰品 · 耳环',category:'accessories',price:'¥49',size:'约3cm',material:'合金',moq:'5对',image:'images/accessories-02.jpg',new:false}
    ];
    let current='all', order='new';
    const catalog=document.getElementById('catalog');
    let registered=localStorage.getItem('enny-registered')==='1';function priceMarkup(p){return registered?`价格：${p.price}`:`<button class="price-lock" onclick="openRegister()">注册后查看价格</button>`}function render(){let list=products.filter(p=>current==='all'||p.category===current);if(order==='new')list.sort((a,b)=>Number(b.new)-Number(a.new));else list.sort((a,b)=>a.name.localeCompare(b.name));catalog.innerHTML=list.length?list.map(p=>`<article class="card"><div class="product-image"><img src="${p.image}" alt="${p.name}" onerror="this.remove();this.parentNode.insertAdjacentHTML('afterbegin','<span>Enny China</span>')">${p.new?'<span class="tag">NEW</span>':''}</div><div class="info"><h3>${p.name}</h3><p>${p.type} · ${priceMarkup(p)}</p><p>尺寸：${p.size} · 材质：${p.material} · MOQ：${p.moq}</p><a class="ask" href="https://wa.me/8615102035128?text=${encodeURIComponent('Hello Enny, I want to order '+p.name)}">如需下单，请联系我 →</a></div></article>`).join(''):'<div class="empty">这个分类暂时没有产品，欢迎联系我们获取更多款式。</div>'}
    window.openRegister=()=>document.getElementById('registerModal').classList.add('open');document.getElementById('registerBtn').addEventListener('click',openRegister);document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('registerModal').classList.remove('open'));document.getElementById('registerForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('enny-registered','1');registered=true;document.getElementById('registerModal').classList.remove('open');render()});const translations={zh:{home:'首页',catalog:'产品目录',about:'关于 Enny',contact:'联系我们'},en:{home:'Home',catalog:'Catalog',about:'About Enny',contact:'Contact'},ar:{home:'الرئيسية',catalog:'المنتجات',about:'عن Enny',contact:'تواصل معنا'},ru:{home:'Главная',catalog:'Каталог',about:'Об Enny',contact:'Связаться'}};function setLanguage(lang){document.documentElement.lang=lang==='zh'?'zh-CN':lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=translations[lang][el.dataset.i18n]);localStorage.setItem('enny-lang',lang)}async function detectLanguage(){let saved=localStorage.getItem('enny-lang');if(saved){document.getElementById('lang').value=saved;setLanguage(saved);return}let browserLang=(navigator.language||'en').toLowerCase();let lang=browserLang.startsWith('zh')?'zh':browserLang.startsWith('ru')?'ru':browserLang.startsWith('ar')?'ar':'en';try{const r=await fetch('https://ipapi.co/json/');const d=await r.json();if(d.country_code==='CN')lang='zh';else if(['RU','BY','KZ','KG'].includes(d.country_code))lang='ru';else if(['AE','SA','QA','KW','OM','BH','JO','EG','IQ','IL','LB','MA','DZ','TN'].includes(d.country_code))lang='ar'}catch(e){}document.getElementById('lang').value=lang;setLanguage(lang)}document.getElementById('lang').addEventListener('change',e=>setLanguage(e.target.value));detectLanguage();document.querySelectorAll('[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');current=btn.dataset.filter;render()}));document.getElementById('sort').addEventListener('change',e=>{order=e.target.value;render()});const params=new URLSearchParams(location.search);if(params.get('category')){current=params.get('category');const b=document.querySelector(`[data-filter="${current}"]`);if(b){document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active')}}render();document.getElementById('year').textContent=new Date().getFullYear();
  </script>
</body>
</html>
